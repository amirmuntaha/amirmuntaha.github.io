    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Navigation */
        nav {
            padding: 24px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        nav .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link {
            color: #737373;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #fff;
        }

        .nav-link svg {
            width: 20px;
            height: 20px;
        }

        /* Language Toggle */
        .lang-toggle {
            display: flex;
            align-items: center;
            background: #1a1a1a;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #262626;
        }

        .lang-btn {
            padding: 4px 10px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #737373;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            letter-spacing: 0.02em;
        }

        .lang-btn.active {
            background: #fff;
            color: #0a0a0a;
        }

        .lang-btn:hover:not(.active) {
            color: #e5e5e5;
        }

        /* Hero */
        .hero {
            padding: 80px 0 60px;
        }

        .hero h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }

        .hero p {
            color: #737373;
            font-size: 0.95rem;
            max-width: 480px;
            min-height: 1.6em;
        }

        /* Projects */
        .projects {
            padding: 0 0 80px;
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #525252;
            margin-bottom: 24px;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: #1a1a1a;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
        }

        .project-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: #111;
            transition: background 0.2s;
        }

        .project-item:hover {
            background: #171717;
        }

        .project-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .project-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: #fff;
        }

        .project-desc {
            font-size: 0.8rem;
            color: #737373;
        }

        .project-arrow {
            color: #525252;
            font-size: 1rem;
            transition: color 0.2s, transform 0.2s;
        }

        .project-item:hover .project-arrow {
            color: #fff;
            transform: translateX(3px);
        }

        /* Footer */
        footer {
            padding: 32px 0;
            border-top: 1px solid #1a1a1a;
            text-align: center;
        }

        footer p {
            font-size: 0.75rem;
            color: #525252;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .hero {
                padding: 48px 0 40px;
            }

            .hero h1 {
                font-size: 1.5rem;
            }

            .project-item {
                padding: 16px 20px;
            }
        }
    </style>
</head>

    <!-- Hero -->

    <!-- Language Toggle Script -->
    <script>
        const translations = {
            id: {
                heroTitle: 'Hai, saya Amir',
                heroDesc: 'Membuat alat web yang simpel, cepat, dan gratis.',
                sectionLabel: 'Proyek',
                proj1Name: 'Kalkulator Amortisasi Pinjaman',
                proj1Desc: 'Simulasi pembayaran, grafik, ekspor CSV',
                proj2Name: 'Instagram Extractor',
                proj2Desc: 'Unduh konten Instagram dengan mudah'
            },
            en: {
                heroTitle: 'Hey, I\'m Amir',
                heroDesc: 'Building simple, fast, and free web tools.',
                sectionLabel: 'Projects',
                proj1Name: 'Loan Amortization Calculator',
                proj1Desc: 'Simulate payments, charts, export CSV',
                proj2Name: 'Instagram Extractor',
                proj2Desc: 'Download Instagram content easily'
            }
        };

        function setLang(lang) {
            const t = translations[lang];
            document.getElementById('hero-title').textContent = t.heroTitle;
            document.getElementById('hero-desc').textContent = t.heroDesc;
            document.getElementById('section-label').textContent = t.sectionLabel;
            document.getElementById('proj1-name').textContent = t.proj1Name;
            document.getElementById('proj1-desc').textContent = t.proj1Desc;
            document.getElementById('proj2-name').textContent = t.proj2Name;
            document.getElementById('proj2-desc').textContent = t.proj2Desc;
            document.documentElement.lang = lang;

            document.getElementById('btn-id').classList.toggle('active', lang === 'id');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            localStorage.setItem('lang', lang);
        }

        // Init: load saved language or default to ID
        const savedLang = localStorage.getItem('lang') || 'id';
        setLang(savedLang);
    </script>
